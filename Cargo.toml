[package]
name = "dfint_hook"
version = "0.1.3"
edition = "2021"

[lib]
name = "dfint_hook"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
macro = { path = "src/macro" }
raw = { path = "src/raw" }

retour = { version = "0.4.0-alpha.4", features = ["static-detour"] }
log = "0.4.28"
simple-logging = "2.0.2"
regex = "1.12.2"
backtrace = "0.3.76"
serde = { version = "1.0.228", features = ["derive"] }
static_init = "1.0.4"
anyhow = "1.0.100"
device_query = "4.0.1"
fontdue = "0.9.3"
bitflags = "2.10.0"
csv = "1.4.0"
indexmap = "2.12.0"
goblin = "0.10.3"

[target.'cfg(target_os = "windows")'.dependencies]
exe = "0.5.6"
winapi = { version = "0.3.9", features = [
  "minwindef",
  "winnt",
  "libloaderapi",
  "windef",
  "winuser",
] }
sdl2 = { version = "0.38.0", features = ["use-vcpkg"] }

[target.'cfg(target_os = "linux")'.dependencies]
checksum = "0.2.1"
sdl2 = "0.38.0"
